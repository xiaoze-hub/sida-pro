# 数智分析 (PanWatch fork) 一键部署编排
#
# 用途: 朋友在新服务器上 fork 仓库 + 拉公开镜像后,一条命令启主后端 + 预测引擎
# 镜像源: ghcr.io/xiaoze-hub/stock-intelligent-data-analytics(主) + -forecast(预测)
# 公开: 匿名可拉,无需 PAT
#
# 启动: docker compose up -d
# 停止: docker compose down
# 日志: docker compose logs -f
#
# 数据持久化:
#   - 命名卷 panwatch_data(主后端 DB + Playwright 浏览器)
#   - 命名卷 panwatch_forecast_data(预测引擎 SQLite + 回测报告)
#   - 可选 bind 挂载 ~/.hermes(cron 输出只读, 报告中心数据源)

services:
  # ============== 基础设施层 (Phase 1, 2026-08-17) ==============
  # 默认不启动(可显式 `docker compose --profile infra up -d` 启动)
  # - Redis 7: 缓存 + 限流 + Redis Streams
  # - Prometheus: 抓 /metrics 指标
  # - Loki: 收日志(配 Promtail)
  # - Promtail: 收 panwatch logs 送到 Loki
  # - Grafana: 大盘 (预置 Prometheus + Loki 数据源)
  redis:
    image: redis:7-alpine
    container_name: panwatch-redis
    restart: unless-stopped
    profiles: ["infra"]
    # T10(2026-09-08 审计): 加 requirepass —— 原注释自认"未加密码避免打断现有容器",
    # 主机任何进程可直读全部缓存。密码从 .env 必读(缺失 compose up 直接报错)。
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--maxmemory"
      - "256mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
      - "--requirepass"
      - "${REDIS_PASSWORD:?请在 .env 设置 REDIS_PASSWORD}"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - TZ=Asia/Shanghai
    # P1-3 (2026-08-23 审计): 6379 绑主机 127.0.0.1 而非 0.0.0.0, 防未授权访问;
    # compose 内其它服务通过 panwatch-redis:6379 + 密码访问, 主机仅 localhost 可达。
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    mem_limit: 320m
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: panwatch-prometheus
    restart: unless-stopped
    profiles: ["infra"]
    ports:
      # T10: Prometheus 无鉴权, 只允许本机访问(与 infra 编排对齐; 原绑 0.0.0.0)
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # T10: 补挂告警规则文件(原缺失, --profile infra 启动即因 rule_files 找不到而崩)
      - ./deploy/prometheus-rules.yml:/etc/prometheus/prometheus-rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    environment:
      - TZ=Asia/Shanghai

  loki:
    image: grafana/loki:2.9.4
    container_name: panwatch-loki
    restart: unless-stopped
    profiles: ["infra"]
    ports:
      # T10: Loki 无鉴权, 只允许本机访问(与 infra 编排对齐)
      - "127.0.0.1:3100:3100"
    volumes:
      - ./deploy/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    environment:
      - TZ=Asia/Shanghai

  promtail:
    image: grafana/promtail:2.9.4
    container_name: panwatch-promtail
    restart: unless-stopped
    profiles: ["infra"]
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./deploy/promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    mem_limit: 192m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    environment:
      - TZ=Asia/Shanghai

  grafana:
    image: grafana/grafana:10.4.2
    container_name: panwatch-grafana
    restart: unless-stopped
    profiles: ["infra"]
    ports:
      # T10: Grafana 只允许本机访问(经 SSH 隧道/反代使用; 原绑 0.0.0.0)
      - "127.0.0.1:35099:3000"
    environment:
      # P1-2 (2026-08-23 审计): 不再硬编码 admin 密码, 从 env_file 必读;
      # ${VAR:?err} 语法使缺失时 compose up 直接报错而不是用危险默认值。
      # 在 .env (或 compose env_file) 里设 GF_SECURITY_ADMIN_PASSWORD=<强密码>。
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?err GF_SECURITY_ADMIN_PASSWORD not set in .env}
      - GF_USERS_ALLOW_SIGN_UP=false
      - TZ=Asia/Shanghai
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana-provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # T11(2026-09-08 审计): 告警通知出口 —— 五条规则此前触发后无任何通知
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: panwatch-alertmanager
    restart: unless-stopped
    profiles: ["infra"]
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./deploy/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - TZ=Asia/Shanghai

  # ============== 主后端 8000 (FastAPI) ==============
  panwatch:
    # P1-14: 与 CI 一致拉 ACR(发版号替换 latest); forecast 镜像仍走 ghcr(独立构建链)
    image: crpi-mte80ai8o78b1429.cn-shanghai.personal.cr.aliyuncs.com/xiaozexwz/xzxwz:latest
    container_name: panwatch
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # 指向同 compose 网络内的 forecast 服务(Docker DNS 自动解析)
      - FORECAST_ENGINE_URL=http://forecast:8010
      # P1-14: Redis L2/限流/调度选主走 compose 内 redis(T10: 带 requirepass 密码)
      - REDIS_URL=redis://:${REDIS_PASSWORD:?请在 .env 设置 REDIS_PASSWORD}@panwatch-redis:6379/0
      # PG 主库(默认生产口径; 本地无 PG 时才落 SQLite, 见 P1-14):
      # T10: 密码强制从 .env 读取(原 :-sida_dev_only 弱默认静默兜底)
      - SIDA_DB_URL=postgresql+psycopg2://sida:${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}@panwatch-postgres:5432/sida
      # Hermes cron 输出根目录(可选,挂载 ~/.hermes 后自动可用)
      - HERMES_HOME=/hermes
      # 数据源 key 在「设置 → 接口Key」UI 维护;此处只传 Hermes 必需的环境变量
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
      - DOCKER=1
      # v0.4.47 fix (2026-09-01): server.py 默认监听 127.0.0.1, Docker `-p 8000:8000`
      # 必须显式 0.0.0.0, 否则 docker-proxy 转发到容器 IP 172.19.0.x 时 connection reset,
      # 外部全 502。下次 WSL/Docker 重启一定要带上,否则复发。
      - WEB_HOST=0.0.0.0
    volumes:
      - panwatch_data:/app/data
      # 可选: Hermes cron 输出(报告中心读取 cron 报告用)
      # ⚠️ 朋友请改成自己的路径,不存在会自动创建空目录不影响服务启动
      - ~/.hermes:/hermes:ro
    mem_limit: 1500m
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    depends_on:
      forecast:
        condition: service_healthy
      redis:
        condition: service_healthy
        required: false
      panwatch-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # ============== 预测引擎 8010 (Kronos/XGBoost/Lag-Llama/LinearReg) ==============
  forecast:
    image: ghcr.io/xiaoze-hub/stock-intelligent-data-analytics-forecast:latest
    container_name: panwatch-forecast
    restart: unless-stopped
    expose:
      - "8010"   # 不暴露给主机,仅 compose 网络内访问
    environment:
      # 预测引擎经 8000 拿资金面/龙虎榜数据(fork 镜像里 /api/market-data/* 已就绪)
      # D5(2026-09-09): 原 PANWATCH_URL 更名 —— forecast_lib 内禁止 PANWATCH_URL
      # 字样(CI 依赖方向断言), 8010 情绪 LLM 配置改由 8000 经 POST /predict payload 推送
      - SIDA_MAIN_API_URL=http://panwatch:8000
      # T7(2026-09-08): 配置通道走 HTTP —— 服务 token(与主服务 SIDA_SERVICE_TOKEN
      # 同值, 在 .env 设置)鉴权读 /api/service/forecast-config, 下发 forecast_llm_* +
      # 裁判场景绑定。2026-09-08 风险方案 0.0: 原 sqlite 直读主库的环境变量与主数据
      # 卷只读挂载已整体删除, 8010 对主库零接触; 配置不可得时裁判按 abstain 处理。
      - PANWATCH_SERVICE_TOKEN=${SIDA_SERVICE_TOKEN:-}
      # 预测历史必须落到 panwatch_forecast_data 命名卷
      - FORECAST_DB_PATH=/app/data/panwatch_forecast.db
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
    volumes:
      # 预测历史 SQLite(回测报告/预测记录/资金面 LLM 情绪记录)
      - panwatch_forecast_data:/app/data
    mem_limit: 4g
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      start_period: 60s   # Kronos 模型加载 ~25s
      retries: 3

  # ============== PG 主库(默认生产口径; SQLite 仅本地无 PG 时的开发退路) ==============
  panwatch-postgres:
    image: postgres:16-alpine
    container_name: panwatch-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=sida
      # T10: 密码强制从 .env 读取(原 :-sida_dev_only 弱默认静默兜底, 与 grafana 的 :? 强制语法对齐)
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
      - POSTGRES_DB=sida
      - TZ=Asia/Shanghai
    volumes:
      - panwatch_pg_data:/var/lib/postgresql/data
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "30m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sida -d sida"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  panwatch_pg_data:
    name: panwatch_pg_data
  panwatch_data:
    name: panwatch_data
  panwatch_forecast_data:
    name: panwatch_forecast_data
  redis_data:
    name: panwatch_redis_data
  alertmanager_data:
    name: panwatch_alertmanager_data
  prometheus_data:
    name: panwatch_prometheus_data
  loki_data:
    name: panwatch_loki_data
  grafana_data:
    name: panwatch_grafana_data
