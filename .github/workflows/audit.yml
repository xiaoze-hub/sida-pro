# audit.yml · 依赖漏洞周扫描 (tier2-stability 2026-09-18)
#
# 每周一跑 pip-audit + npm audit + 简化离线扫描;
# 发现 high/critical 时创建/更新 GitHub Issue。
# 手动 workflow_dispatch 可随时触发。
#
# 权限: contents:read + issues:write(创建 Issue)。
# 继续沿用本仓 pin SHA 的 action 风格(nightly-network-tests.yml)。

name: dependency-audit

on:
  schedule:
    # UTC 02:00 周一 = 北京时间 10:00 周一, 避开凌晨行情/备份窗口
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  python-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: pip-audit (requirements)
        # requirements-lock.txt 存在则优先审计锁定依赖; 否则 requirements.txt。
        # 有漏洞时 pip-audit 非 0 退出 → continue-on-error, 交给 Issue 步骤。
        continue-on-error: true
        run: |
          REQ="requirements.txt"
          if [ -f requirements-lock.txt ]; then
            REQ="requirements-lock.txt"
          fi
          echo "Auditing $REQ"
          pip-audit -r "$REQ" --progress-spinner off --output json --output pip-audit.json
          python scripts/_parse_pip_audit.py pip-audit.json pip-audit-summary.txt

      - name: Offline simplified scan
        continue-on-error: true
        run: |
          python scripts/audit_deps.py --json > audit_deps.json
          python scripts/audit_deps.py

      - name: Upload python audit artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-audit-report
          path: |
            pip-audit.json
            pip-audit-summary.txt
            audit_deps.json
          if-no-files-found: ignore

      - name: Detect high severity (python)
        id: py_severity
        run: python scripts/_audit_high_flag.py

      - name: Create/Update Issue (python)
        if: steps.py_severity.outputs.high == '1'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        with:
          script: |
            const fs = require('fs');
            let body = '## 依赖漏洞扫描告警 (pip-audit)\n\n';
            body += `触发: schedule/workflow_dispatch  @ ${new Date().toISOString()}\n\n`;
            try {
              const offline = fs.readFileSync('audit_deps.json','utf8');
              body += '### 简化离线扫描\n```json\n' + offline.slice(0, 6000) + '\n```\n\n';
            } catch {}
            try {
              const sum = fs.readFileSync('pip-audit-summary.txt','utf8');
              body += '### pip-audit\n```\n' + sum.slice(0, 6000) + '\n```\n';
            } catch {}
            body += '\n复现: `pip-audit -r requirements-lock.txt` / `python scripts/audit_deps.py`';
            const title = '[audit] Python 依赖存在 high/critical 漏洞';
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security,dependency-audit',
              per_page: 20,
            });
            const existing = issues.data.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['security', 'dependency-audit'],
              });
            }

  npm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@1e60f620b9541dca939356ce04c9522e956145c8 # v4
        with:
          node-version: '20'

      - name: Install deps (pnpm)
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: npm audit
        continue-on-error: true
        run: |
          pnpm audit --json > ../npm-audit.json || true
          pnpm audit --audit-level=high > ../npm-audit.txt || true

      - name: Upload npm audit artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-audit-report
          path: |
            npm-audit.json
            npm-audit.txt
          if-no-files-found: ignore

      - name: Detect high severity (npm)
        id: npm_severity
        working-directory: .
        run: |
          HIGH=0
          if [ -f npm-audit.json ]; then
            if node -e 'const d=JSON.parse(require("fs").readFileSync("npm-audit.json","utf8")); const m=(d.metadata&&d.metadata.vulnerabilities)||{}; process.exit(((m.high||0)+(m.critical||0))>0?0:1)'; then
              HIGH=1
            fi
          fi
          echo "high=$HIGH" >> "$GITHUB_OUTPUT"

      - name: Create/Update Issue (npm)
        if: steps.npm_severity.outputs.high == '1'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        with:
          script: |
            const fs = require('fs');
            let body = '## 依赖漏洞扫描告警 (npm audit)\n\n';
            body += `触发: schedule/workflow_dispatch  @ ${new Date().toISOString()}\n\n`;
            try {
              const txt = fs.readFileSync('npm-audit.txt','utf8');
              body += '```\n' + txt.slice(0, 8000) + '\n```\n';
            } catch {}
            body += '\n复现: `cd frontend && pnpm audit`';
            const title = '[audit] npm 依赖存在 high/critical 漏洞';
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security,dependency-audit',
              per_page: 20,
            });
            const existing = issues.data.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['security', 'dependency-audit'],
              });
            }
