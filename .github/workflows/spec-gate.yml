# 规格追溯门禁 —— CI 硬门禁(借鉴 self-hosting-agent 的 trace.mjs)
#
# 位置很关键: 走 push + pull_request(事前拦截), 不是 schedule(事后发现)。
# 违规时非零退出 → 挡住合并。
#
name: spec-traceability

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spec-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      # 门禁本身: 规格 ⇄ 测试 双向校验
      # 违规情形:
      #   1. 规格有验收标准, 却没有任何测试引用它  → 文档里的空头承诺
      #   2. 测试引用了不存在的规格 ID             → 测试在验证幻觉
      #   3. 某个规格文件一条标准都没识别出来      → 门禁自己骗人
      - name: Spec traceability gate
        run: python scripts/trace_specs.py

      # 规格守卫测试本身(只跑 test_spec_*.py, 不跑全量 —— 全量留给别的 job)
      - name: Spec guard tests
        run: |
          python -m pip install --upgrade pip
          # 守卫测试会 import 真实模块（注册表 / 口径 / marketdata），所以不能只装 pytest：
          # 装项目真实依赖，但跳过 playwright 浏览器包（门禁不需要，装它要多花 1-2 分钟）。
          grep -viE '^playwright' requirements.txt > /tmp/gate-req.txt
          python -m pip install -q -r /tmp/gate-req.txt
          python -m pytest tests/test_spec_*.py -q

      - name: Upload traceability report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spec-traceability
          path: specs/traceability.md
          if-no-files-found: ignore
