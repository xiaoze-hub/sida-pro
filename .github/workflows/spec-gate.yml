# 规格追溯门禁 —— CI 硬门禁(借鉴 self-hosting-agent 的 trace.mjs)
#
# 位置很关键: 走 push + pull_request(事前拦截), 不是 schedule(事后发现)。
# 违规时非零退出 → 挡住合并。
#
name: spec-traceability

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spec-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      # 门禁本身: 规格 ⇄ 测试 双向校验
      # 违规情形:
      #   1. 规格有验收标准, 却没有任何测试引用它  → 文档里的空头承诺
      #   2. 测试引用了不存在的规格 ID             → 测试在验证幻觉
      #   3. 某个规格文件一条标准都没识别出来      → 门禁自己骗人
      - name: Spec traceability gate
        run: python scripts/trace_specs.py

      # 规格守卫测试本身(只跑 test_spec_*.py, 不跑全量 —— 全量留给别的 job)
      - name: Spec guard tests
        run: |
          python -m pip install --upgrade pip
          # 守卫测试会 import 真实模块（注册表 / 口径 / 配方），所以门禁不能只装 pytest：
          #   pyyaml   —— 读 src/harness/recipes/*.yaml
          #   sqlalchemy / pydantic / pydantic-settings —— src.db.* 与服务配置（工具口径守卫的 setup 会走到）
          # 缺任何一个都会以 exit 2（收集错误）整条挂掉，看起来像"测试失败"，其实一条都没跑。
          python -m pip install pytest pyyaml sqlalchemy pydantic pydantic-settings
          python -m pytest tests/test_spec_*.py -q

      - name: Upload traceability report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spec-traceability
          path: specs/traceability.md
          if-no-files-found: ignore
