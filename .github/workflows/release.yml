name: release

on:
  push:
    tags:
      # PanWatch tags are like 0.2.3 (no "v" prefix)
      - '*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Docker tag to publish (e.g. 0.2.3)'
        required: true
        type: string
      push_latest:
        description: 'Also push :latest'
        required: false
        type: boolean
        default: true
      platforms:
        description: 'Target platforms'
        required: false
        type: string
        default: 'linux/amd64,linux/arm64'

env:
  IMAGE_NAME: xiaoze-hub/stock-intelligent-data-analytics

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read   # 拉取私有 ghcr.io/xiaoze-hub/thsdk-vendor

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Frontend gates (门禁 · tsc + eslint + vitest + ui-rules)
        working-directory: frontend
        run: |
          npx tsc -b
          pnpm lint
          pnpm test
          node ../scripts/check_ui_rules.mjs

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install system libs for WeasyPrint (PDF export tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libpangoft2-1.0-0 \
            libcairo2 libcairo-gobject2 libgdk-pixbuf-2.0-0 \
            libffi-dev libfontconfig1 fonts-noto-cjk

      - name: Install dependencies
        # W2.5/E6(2026-09-09): 统一走 requirements-lock.txt(生产容器 freeze 精确版本);
        # 本地包 marketdata 与 Dockerfile 同口径 --no-deps 单独装(lock 不含 -e 行)
        run: |
          pip install -r requirements-lock.txt
          pip install --no-deps -e ./packages/marketdata
          python scripts/check_lock_covers_reqs.py

      - name: Multi-tenant scope check (门禁 · C3 越权静态扫描)
        # W2.1/C3(2026-09-09): 与 build-and-push-image.yml 同门禁
        run: python scripts/check_scoped_queries.py

      - name: Run tests
        # 2026-08-21: conftest 已加 _init_test_db + _clear_module_caches fixture 修好顺序污染,
        # 缓存类 3 文件不再需要 ignore。
        # 2026-09-08 0.6: 固定默认密码与其开关已删除,
        # 需要登录的测试文件自备 AUTH_USERNAME/AUTH_PASSWORD(见各测试 fixture)。
        # W2.3/E2(2026-09-09): 联网测试统一打 pytestmark=network(10 文件, pyproject 已注册),
        # 主门禁 -m "not network" 一刀切(与 build-and-push-image.yml 一致),
        # 保留 2 个 CI 环境级 broken 文件的 --ignore; nightly 工作流单独跑 network 集合。
        run: |
          python -m pytest tests/ -m "not network" \
            --ignore=tests/test_dark_l2_engine.py \
            --ignore=tests/test_thsdk_extended.py \
            -q

      - name: Run marketdata package tests
        run: python -m pytest packages/marketdata/tests -q

      - name: Resolve version
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
            push_latest="${{ inputs.push_latest }}"
            platforms="${{ inputs.platforms }}"
          else
            version="${{ github.ref_name }}"
            push_latest="true"
            platforms="linux/amd64,linux/arm64"
          fi

          version_no_v="$version"
          if [[ "$version" == v* ]]; then
            version_no_v="${version#v}"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_no_v=$version_no_v" >> "$GITHUB_OUTPUT"
          echo "push_latest=$push_latest" >> "$GITHUB_OUTPUT"
          echo "platforms=$platforms" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry (thsdk vendor)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: xiaoze-hub
          # GITHUB_TOKEN 拉不到账号级其他私有包, 用经典 PAT(write:packages)
          password: ${{ secrets.GHCR_PAT }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Check Docker Hub credentials
        id: dockerhub-check
        env:
          DH_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DH_USERNAME" ] && [ -n "$DH_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        if: steps.dockerhub-check.outputs.available == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.version }}
            type=raw,value=${{ steps.vars.outputs.version_no_v }},enable=${{ steps.vars.outputs.version_no_v != steps.vars.outputs.version }}
            type=raw,value=latest,enable=${{ steps.vars.outputs.push_latest == 'true' }}
          labels: |
            org.opencontainers.image.title=PanWatch
            org.opencontainers.image.version=${{ steps.vars.outputs.version }}
            org.opencontainers.image.source=${{ github.repositoryUrl }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ steps.vars.outputs.platforms }}
          # Docker Hub secrets 未配置时只构建不推送(Release 创建不被阻断)
          push: ${{ steps.dockerhub-check.outputs.available == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate release notes (tag push only)
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          current="${{ steps.vars.outputs.version }}"
          repo="${{ github.repository }}"

          # Find previous tag by semver sort (best effort).
          prev=""
          while IFS= read -r t; do
            if [[ "$t" != "$current" ]]; then
              prev="$t"
              break
            fi
          done < <(git tag --list --sort=-v:refname)

          echo "Current tag: $current"
          if [[ -n "$prev" ]]; then
            echo "Previous tag: $prev"
            range="$prev..$current"
          else
            echo "Previous tag: (none)"
            range="$current"
          fi

          {
            echo "## Docker"
            echo "- $IMAGE_NAME:$current"
            echo "- $IMAGE_NAME:latest"
            echo ""
            echo "## Commits"
            if [[ -n "$prev" ]]; then
              echo "Compare: https://github.com/$repo/compare/$prev...$current"
              echo ""
              echo "Changes since $prev:"
              echo ""
              # Non-merge commits only (exclude MR/PR merges).
              git log --no-merges --pretty=format:'- %s (%h)' "$range" || true
            else
              echo "First release tag."
            fi
            echo ""
          } > release-notes.md

      - name: Create GitHub Release (tag push only)
        if: ${{ github.event_name == 'push' }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.vars.outputs.version }}
          body_path: release-notes.md

      - name: Send Telegram notification
        if: ${{ github.event_name == 'push' }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TAG="${{ steps.vars.outputs.version }}"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG}"

          # 获取 commit 变更列表
          PREV_TAG=$(git tag --list --sort=-version:refname | grep -v "^${TAG}$" | head -n1)
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log --no-merges --pretty=format:"- %s" "$PREV_TAG"..HEAD)
          else
            COMMITS=$(git log --no-merges --pretty=format:"- %s")
          fi

          # 转义 Markdown 特殊字符，然后进行 URL 编码
          COMMITS_ESCAPED=$(echo "$COMMITS" | sed 's/\*/\\*/g; s/_/\\_/g; s/\[/\\[/g; s/\]/\\]/g; s/`/\\`/g')
          COMMITS_ENCODED=$(echo "$COMMITS_ESCAPED" | sed 's/$/%0A/g' | tr -d '\n')

          # 构建消息
          MESSAGE="📊 *PanWatch ${TAG}* 发布%0A%0A"
          MESSAGE="${MESSAGE}🔗 [查看完整说明](${RELEASE_URL})%0A%0A"
          MESSAGE="${MESSAGE}*变更内容*:%0A${COMMITS_ENCODED}"

          # 发送到 Telegram
          if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              -d "text=${MESSAGE}" \
              -d "parse_mode=Markdown" \
              -d "disable_web_page_preview=true"
            echo "✅ Telegram notification sent successfully!"
          else
            echo "⚠️  Telegram credentials not configured, skipping notification"
          fi
