# build-and-push-image.yml · PanWatch Docker 镜像构建+推送到 GHCR
#
# 触发: 推 git tag(v*.*.*)或手动 dispatch
# 产出: ghcr.io/xiaoze-hub/stock-intelligent-data-analytics:latest(及对应版本号)
# 用途: 同事部署 `docker pull ghcr.io/xiaoze-hub/stock-intelligent-data-analytics:latest`
#
# 门禁(2026-08-09 加入,对齐研究 P0「任何一步失败都不推送」):
#   test job = 前端 tsc typecheck + 后端 pytest,任一失败 → build job 不执行。

name: build-and-push-image

on:
  push:
    tags:
      - 'v*.*.*'           # 推 v0.1.0 这种 tag 触发
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像 tag(留空用 latest)'
        required: false
        default: ''
  # 2026-09-08 审计: 补 PR 门禁(合并前跑 test job, build 只在 tag/dispatch 触发)
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write          # 推 GHCR 需要

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Frontend gates (门禁 · tsc + eslint + vitest + ui-rules)
        working-directory: frontend
        run: |
          npx tsc -b
          pnpm lint
          pnpm test
          node ../scripts/check_ui_rules.mjs

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install system libs for WeasyPrint (PDF export tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libpangoft2-1.0-0 \
            libcairo2 libcairo-gobject2 libgdk-pixbuf-2.0-0 \
            libffi-dev libfontconfig1 fonts-noto-cjk

      - name: Install Python deps
        # W2.5/E6(2026-09-09): 统一走 requirements-lock.txt(生产容器 freeze 精确版本);
        # 本地包 marketdata 与 Dockerfile 同口径 --no-deps 单独装(lock 不含 -e 行)
        run: |
          pip install -r requirements-lock.txt
          pip install --no-deps -e ./packages/marketdata
          python scripts/check_lock_covers_reqs.py

      - name: Lint (门禁 · ruff 真 bug 类)
        run: |
          pip install ruff
          ruff check src/ server.py forecast_server.py scripts/ packages/marketdata/src \
            --select E9,F821,F601,F811

      - name: Migration consistency check (门禁 · P2-A 迁移校验)
        # 不连 DB 的纯静态检查: 版本号连续/模型列与 HEALTH_COLUMNS 一致/
        # 计数列 server_default 防回归。失败即拦构建 (v0.4.51 缺列 500 教训)。
        run: python scripts/check_migrations.py

      - name: Multi-tenant scope check (门禁 · C3 越权静态扫描)
        # W2.1/C3(2026-09-09): src/web/api 下 db.query(带 user_id 的模型)必须走
        # scoped()/owned_or_404()/writable() 或显式 @allow_cross_user 豁免。
        run: python scripts/check_scoped_queries.py
      - name: Dialect layer scope check (门禁 · W3.1 IS_PG 只在 src/db)
        run: python scripts/check_is_pg_scope.py

      - name: Backend tests (门禁 · pytest)
        # 2026-09-08 0.6: 固定默认密码与其开关已删除,
        # 需要登录的测试文件自备 AUTH_USERNAME/AUTH_PASSWORD(见各测试 fixture)。
        run: |
          # W2.3/E2(2026-09-09): 联网测试统一打 pytestmark=network(10 文件, pyproject 已注册),
          # 主门禁 -m "not network" 一刀切, 新增联网测试只需打标, 不再维护 ignore 清单。
          # 夜间网络工作流(nightly-network-tests.yml)单独跑 -m network。
          # 仍保留 2 个 --ignore: 这两文件在 CI 环境缺依赖/数据即使不打网络也会挂(本地已验证)。
          python -m pytest tests/ -x -q -m "not network" \
            --ignore=tests/test_dark_l2_engine.py \
            --ignore=tests/test_thsdk_extended.py
          python -m pytest packages/marketdata/tests -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: xiaoze-hub
          # GITHUB_TOKEN 在仓库公开后推 ghcr 偶发 write_package 拒绝,改用经典 PAT(write:packages)
          password: ${{ secrets.GHCR_PAT }}

      - name: Determine image tag
        id: meta
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [ -n "${{ github.ref_name }}" ] && [ "${{ github.ref_name }}" != "main" ]; then
            # tag 触发: 保留 v 前缀(与 ghcr 现有 v0.2.x tag 一致)
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="latest"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "image=ghcr.io/xiaoze-hub/stock-intelligent-data-analytics" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.tag }}
          tags: |
            ghcr.io/xiaoze-hub/stock-intelligent-data-analytics:latest
            ghcr.io/xiaoze-hub/stock-intelligent-data-analytics:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          labels: |
            org.opencontainers.image.title=数智分析 SIDA
            org.opencontainers.image.description=数智分析 · 自托管 AI 盯盘助手
            org.opencontainers.image.source=https://github.com/xiaoze-hub/Stock-Intelligent-Data-Analytics
            org.opencontainers.image.licenses=AGPL-3.0

      - name: Debug failure
        if: failure()
        run: |
          echo "### ❌ Build failed - 常见原因:"
          echo "1. GHCR token 权限不足: Settings → Actions → General → Workflow permissions → Read and write permissions"
          echo "2. 仓库 Packages 权限未开启: Settings → General → Enable 'Packages'"
          echo "3. 镜像 base image 拉不到(网络限制)"
          echo "4. Dockerfile 语法错误"
          echo ""
          echo "请查看 workflow run 详情获取完整日志"
