name: build-push-acr

# 发版构建: tag 推送触发 → 构建镜像 → 推阿里云 ACR(国内拉取快)
# 解决: ACR 代码源构建无法拉取 private 仓库代码的问题
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # P2-27 (2026-09-05 28号审计): 生产镜像构建前门禁 — tsc/pytest 任一红灯, 坏 tag 推不上生产
  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Backend pytest
        run: |
          python3 -m pip install -q -r requirements.txt pytest-timeout 2>/dev/null || true
          # 单测禁联网: 超 60s 的用例直接失败(防网络挂起拖死构建)
          python3 -m pytest tests/ -q --timeout=60 2>&1 | tail -3
      - name: Frontend typecheck
        run: |
          cd frontend
          npm install -g pnpm --silent 2>/dev/null || true
          pnpm install --frozen-lockfile
          pnpm typecheck

  build:
    runs-on: ubuntu-latest
    needs: gates
    permissions:
      contents: read
      packages: read   # 拉取私有 ghcr.io/xiaoze-hub/thsdk-vendor(L2 私有 SDK)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read VERSION
        id: ver
        run: |
          # 2026-08-20 修复: 优先用 git ref (tag push 时 GITHUB_REF_NAME="v0.3.2"), 避免 VERSION 文件滞后
          # P2-27 (2026-09-05 28号审计): 用 GITHUB_REF_TYPE=='tag' 判定(旧 refs/tags/ 前缀永不匹配)
          # 导致 push 用错 tag (例如 tag=v0.3.2 但推 v0.3.0)。回退到 VERSION 文件兜底。
          REF_TYPE="${GITHUB_REF_TYPE:-}"
          REF_NAME="${GITHUB_REF_NAME:-}"
          if [[ "$REF_TYPE" == "tag" && "$REF_NAME" == v* ]]; then
            V="$REF_NAME"
          elif [[ "$REF_NAME" == v* ]]; then
            V="$REF_NAME"
          else
            V=$(cat VERSION 2>/dev/null || echo "0.0.0")
          fi
          echo "version=$V" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry (thsdk vendor)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: xiaoze-hub
          # GITHUB_TOKEN 拉不到账号级其他私有包, 用经典 PAT(write:packages)
          password: ${{ secrets.GHCR_PAT }}

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: crpi-mte80ai8o78b1429.cn-shanghai.personal.cr.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            crpi-mte80ai8o78b1429.cn-shanghai.personal.cr.aliyuncs.com/xiaozexwz/xzxwz:${{ steps.ver.outputs.version }}
            crpi-mte80ai8o78b1429.cn-shanghai.personal.cr.aliyuncs.com/xiaozexwz/xzxwz:latest
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          # 个人版 ACR 不支持 OCI attestation 清单(unknown manifest class for empty.v1+json)
          provenance: false
          sbom: false
