name: build-push-acr

# 门禁流水线: tag 推送 / PR / 手动 触发 → 只跑门禁(gates + 4 片 pytest + 覆盖率棘轮 + 前端)
#
# ⚠️ 2026-09-30: 本工作流**不再负责构建/推送镜像**。
#    原因: 美区 GitHub Actions runner 走 `pushing layers` 一步耗时 3761.7s(62.7min)
#    (跨太平洋推 ~2.43GB 到 cn-shanghai ACR); 国内云机(腾讯云上海)推同一步仅 768s(12.8min, 4.9×)。
#    镜像现由**国内云机构建并推送**: 脚本 /opt/cn-build/build_and_push.sh(见 skill cn-acr-build-channel)。
#
# ⚠️ 质量底线不变("门禁全绿才推镜像"): 原设计靠 `build.needs: coverage-ratchet` 强制——门禁红则 build skipped。
#    现在这条约束由**发版脚本**承担: ~/.hermes/scripts/sida_release.sh <版本> 会先等本工作流
#    对该 tag 的运行**全绿**(gh run watch + 校 conclusion), 未绿**硬拒绝**构建与部署, 不许绕过。
#    因此本工作流只保留门禁作业; 门禁(含 4 片 + 棘轮 + 前端)一个都没少。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
  # 2026-09-08 审计: 合并前没有任何 CI 跑过(测试只在打 tag 时执行), 补 PR 门禁
  pull_request:
    branches:
      - main

jobs:
  # P2-27 (2026-09-05 28号审计): 生产镜像构建前门禁 — tsc/pytest 任一红灯, 坏 tag 推不上生产
  # 2026-09-08 审计修复: 原 `pytest | tail -3` 管道退出码取 tail, 全红照样绿;
  # `pip install || true` 依赖装不上也继续 — 门禁形同虚设。
  # 2026-09-29: 后端 pytest 从本作业拆出为 4 片矩阵并行(见 backend-pytest) + 覆盖率汇总作业
  # (coverage-ratchet), 本作业只留快门禁(语法/部署 stub/gitleaks/三个静态检查/前端),
  # 与分片作业**并行**跑, 门禁总时长 23min → ~9min。用例集合/过滤条件/棘轮口径均不变。
  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Shell syntax check (bash -n)
        run: |
          set -euo pipefail
          shopt -s nullglob
          # 0.1 类事故(行内注释截断续行命令)语法层即可发现
          for f in deploy/*.sh scripts/*.sh; do
            bash -n "$f"
            echo "OK $f"
          done
      - name: Deploy script stub test (DOCKER=echo)
        run: |
          set -euo pipefail
          # 0.1: 部署脚本重建参数完整性+先验证后切换顺序+失败不删旧容器, echo 桩断言。
          # 这是防止"注释再次被插回 docker run 续行块"的唯一机制(2026-09-08 停机事故)。
          bash scripts/tests/test_deploy_script.sh
      - name: Secret scan (gitleaks v8.18.4, SHA256 pinned)
        run: |
          set -euo pipefail
          # 固定版本二进制+校验和, 不引入未钉版的第三方 action(0.6 治理项)
          curl -sSfL -o /tmp/gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          echo "ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          # 扫工作区全部文件(不依赖 git 历史深度); --redact 防命中内容泄进 CI 日志
          /tmp/gitleaks detect --no-git --redact
      - name: Set up Python 3.11 (与生产一致)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install system libs for WeasyPrint (PDF export tests)
        # 2026-09-18: gates job 原缺这一步 ⇒ PDF 用例在 CI 渲染出乱码二进制而红
        # (`test_pdf_export` 断言正文文本)。与 build-and-push-image.yml 的 test job 对齐。
        # 2026-09-29: pytest 已搬去 backend-pytest(那里同样装了这套库), 本步骤保留不动。
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpango-1.0-0 libpangoft2-1.0-0 libcairo2 \
            libgdk-pixbuf-2.0-0 libffi-dev shared-mime-info fonts-noto-cjk

      - name: Backend static gates (lock drift / scoped queries / dialect scope)
        # W2.5/E6(2026-09-09): 依赖统一走 requirements-lock.txt(生产容器 freeze 的精确版本)
        # W2.1/C3(2026-09-09): 越权静态扫描(与 build-and-push-image.yml 同门禁)
        # W3.1/D2(2026-09-09): 方言分叉只允许出现在 src/db/ 层
        # 原与 pytest 同步骤, 2026-09-29 pytest 拆走后留在本作业。
        # 2026-09-29 修复: 当时误判为"纯 stdlib", 实际 check_scoped_queries.py 需要 sqlalchemy
        #   (依赖原本由 pytest 步骤安装) → 拆走后本作业必须自己补装 lock 依赖, 否则
        #   ModuleNotFoundError: No module named 'sqlalchemy' (v0.13.34 首次分片发版即因此红)。
        run: |
          set -euo pipefail
          python3 -m pip install -q -r requirements-lock.txt
          python3 scripts/check_lock_covers_reqs.py
          python3 scripts/check_scoped_queries.py
          python3 scripts/check_is_pg_scope.py
      - name: Frontend gates (tsc + eslint + vitest + ui-rules)
        run: |
          cd frontend
          npm install -g pnpm --silent 2>/dev/null || true
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm lint
          pnpm test
          node ../scripts/check_ui_rules.mjs

  # 2026-09-29: 原全量 pytest(~20min, 单 runner 串行)拆成 4 片矩阵并行。
  # 覆盖测试一份不少: 分片集合 = 原门禁测试集合(tests/test_*.py 去掉两个 CI --ignore 文件),
  # 且是**文件级**切分 —— 每个文件整体只属于一片 ⇒ 无重复、无遗漏, 不需要 durations 文件/新依赖。
  # 运行时过滤条件与分片前逐字一致: `-m "not network"` + 两个 --ignore + `--cov=src`。
  # 本作业不再 needs: gates(与快门禁并行, 这才是 23min→~9min 的来源);
  # 覆盖率棘轮在汇总作业 coverage-ratchet 里合并后仍照跑。
  # 2026-09-30: `build` 作业已移除(镜像改国内云机构建), 棘轮仍是独立门禁作业。
  backend-pytest:
    name: Backend pytest shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      # 一片红也要看全 4 片的红(别让 fail-fast 吃掉其它片的诊断信息)
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      # 每片自己的原始覆盖率数据(非隐藏名, artifact 上传不需要 include-hidden-files)
      COVERAGE_FILE: coverage.combined.${{ matrix.shard }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.11 (与生产一致)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install system libs for WeasyPrint (PDF export tests)
        # 2026-09-18: 缺这一步 ⇒ PDF 用例在 CI 渲染出乱码二进制而红(`test_pdf_export` 断言正文文本)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpango-1.0-0 libpangoft2-1.0-0 libcairo2 \
            libgdk-pixbuf-2.0-0 libffi-dev shared-mime-info fonts-noto-cjk
      - name: Install backend deps (requirements-lock.txt)
        run: |
          set -o pipefail
          # W2.5/E6(2026-09-09): 依赖统一走 requirements-lock.txt(生产容器 freeze 的精确版本)
          # lock 不含本仓本地包 marketdata(与 Dockerfile 同口径单独 --no-deps 装)
          python3 -m pip install -q -r requirements-lock.txt pytest-timeout pytest-cov
          python3 -m pip install -q --no-deps -e ./packages/marketdata
      - name: Select shard test files (确定性分片)
        run: |
          set -euo pipefail
          SHARDS=4
          SHARD=${{ matrix.shard }}
          # 权重 = 文件里 test 函数个数, 按权重降序 → 4 片轮流取(LPT 贪心), 四片用例数尽量均衡;
          # 平手用文件名字典序, 保证 4 个 runner 上选出**同一份**划分(确定性, 可复现)。
          mapfile -t FILES < <(
            for f in tests/test_*.py; do
              case "$f" in
                tests/test_dark_l2_engine.py|tests/test_thsdk_extended.py) continue ;;
              esac
              printf '%s %s\n' "$(grep -cE '^[[:space:]]*(async[[:space:]]+)?def test_' "$f")" "$f"
            done | sort -k1,1nr -k2,2 | awk -v n="$SHARDS" -v k="$SHARD" 'NR % n == k - 1 {print $2}'
          )
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::分片 $SHARD/$SHARDS 没选到任何测试文件 —— 分片逻辑失效, 拒绝静默放行"
            exit 1
          fi
          printf '%s\n' "${FILES[@]}" > shard_files.txt
          echo "shard $SHARD/$SHARDS: files=${#FILES[@]}"
          cat shard_files.txt
      - name: Backend pytest shard ${{ matrix.shard }}/4
        run: |
          set -o pipefail
          mapfile -t FILES < shard_files.txt
          # W2.3/E2(2026-09-09): 联网测试统一打 pytestmark=network, CI 主门禁跳过(-m "not network")。
          # 2026-09-18 与 build-and-push-image.yml 的 test job **逐字对齐**(它是实际跑绿的基准):
          #   ① 补两个 --ignore —— 这两个文件在 CI 缺依赖/数据, 本就由 test job 排除;
          #   ② **去掉 `--timeout=60`** —— scrypt(n=2^15) 密集的认证用例在慢跑机上超 60s 被误杀
          #      (test_email_reg_api_keys 三例 + tradingagents 一例), 而 test job 无此超时即通过。
          #      需要超时兜底时用 pytest.ini 的标记粒度, 不再全局压 60s。
          # 2026-09-29 分片: 只把那一步的"跑哪些文件"换成本片的文件清单, 过滤/覆盖率口径不变;
          # 覆盖率 JSON 不在这里生成 —— 4 片的原始数据由汇总作业 combine 后一次性判棘轮。
          python3 -m pytest "${FILES[@]}" -q -m "not network" \
            --ignore=tests/test_dark_l2_engine.py \
            --ignore=tests/test_thsdk_extended.py \
            --cov=src --cov-report=term
      - name: Upload shard coverage data
        # 测试红了也上传: 便于确认"红"是不是分片漏跑造成的
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-shard-${{ matrix.shard }}
          # 直接用 matrix 表达式(不引 env 上下文, 少一层可用性歧义)
          path: coverage.combined.${{ matrix.shard }}
          if-no-files-found: warn
          retention-days: 7

  # 2026-09-29: 分片后覆盖率棘轮的落点 —— 合并 4 片原始数据, 再一次性判棘轮。
  # 不能让棘轮静默失效: 缺 `[run] source = src` 时, 从未被任何用例导入的 src 文件不会进报告,
  # 覆盖率会被算高(棘轮变松)。这里显式给同口径配置, 并已在本地实证 combine 结果与
  # 单次全量跑的报告**逐文件一致**。
  coverage-ratchet:
    name: Backend coverage ratchet (combine 4 shards)
    needs: [gates, backend-pytest]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.11 (与生产一致)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install coverage tooling
        # 与分片作业同一条安装规格(pytest-cov, 未钉版 —— 与拆片前的 gates 完全一致),
        # 保证两边解析到同一个 coverage 版本, 数据格式不打架。本作业只用它的 coverage CLI。
        run: python3 -m pip install -q pytest-cov
      - name: Download shard coverage data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-shard-*
          merge-multiple: true
          path: .
      - name: Combine shard coverage + ratchet (W2.5/E5)
        run: |
          set -euo pipefail
          ls -l coverage.combined.*
          # 硬断言: 4 片数据少一片就是漏跑, 宁可红也别按部分覆盖率放行
          data=(coverage.combined.*)
          if [ "${#data[@]}" -ne 4 ]; then
            echo "::error::期望 4 片覆盖率数据(coverage.combined.1..4), 实际匹配 ${#data[@]} 个"
            exit 1
          fi
          COVERAGE_FILE=coverage.combined python3 -m coverage combine
          # 与分片内 pytest-cov `--cov=src` 同口径(见本作业头注释), 生成棘轮用的 JSON
          # 2026-09-29: omit 掉 tests/test_w32_bootstrap.py 动态生成又删除的临时 agent
          #   (src/agents/w32_demo_agent.py) —— 测量时它在、汇总时已不在,
          #   否则 coverage json 报 `No source for code` 而红。
          printf '[run]\nsource = src\nrelative_files = true\n\n[report]\nomit =\n    *w32_demo_agent.py\n' > .coveragerc-shards
          COVERAGE_FILE=coverage.combined COVERAGE_RCFILE=.coveragerc-shards \
            python3 -m coverage json --ignore-errors -o coverage.json
          # W2.5/E5: 覆盖率棘轮(基线 scripts/coverage-baseline.json, 只许升不许降)
          python3 scripts/check_coverage_ratchet.py coverage.json

  # ⚠️ 2026-09-30: `build` 作业已移除 —— 镜像不再由 GitHub Actions 构建/推送,
  #    改由国内云机(腾讯云上海)执行 /opt/cn-build/build_and_push.sh <版本>。
  #    见文件头说明与 skill cn-acr-build-channel / sida-pro-release-and-wsl-ops。
  #    "门禁全绿才推镜像"由发版脚本 ~/.hermes/scripts/sida_release.sh 承担(先等本工作流绿, 否则硬拒绝)。
  #
  #    ── 回滚到 GitHub Actions 构建 ─────────────────────────────────────────────
  #    1) `git revert <本次 commit>` (或 `git checkout <parent> -- .github/workflows/build-push-acr.yml`)
  #       —— 原 `build` 作业在 git 历史里原样保留, 可原样恢复。
  #    2) 恢复后 tag 推送即由 GH Actions 构建推 ACR, 发版脚本请改用:
  #       SIDA_CI_ONLY=1 (只等门禁、不调云机构建) —— 或直接回退到 sida_prod_deploy.sh 手工链。
  #    (原 build 作业参数: needs coverage-ratchet; buildx; ACR login; timeout-minutes: 90;
  #     provenance/sbom: false; push 版本号取自 tag。详见 git 历史。)
