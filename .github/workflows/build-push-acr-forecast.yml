name: build-push-acr-forecast

# 预测引擎镜像构建: tag 推送触发 → 构建预测引擎 → 推阿里云 ACR
# 2026-09-08 审计: forecast 镜像此前完全没有 CI(生产拉取的 ...-forecast:latest 只能手工构建),
# 补齐门禁(pytest 主仓 tests + Dockerfile.forecast 构建)与 ACR 发布通道。
# 注: forecast_requirements.txt 全部带版本区间(上界防破坏性升级), 主 requirements 的锁版本治理见执行方案 T15。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
  pull_request:
    branches:
      - main
    # PR 时只做构建验证(不推送), 避免每次前端/后端无关 PR 都全量构建 torch 镜像
    paths:
      - 'Dockerfile.forecast'
      - 'forecast_server.py'
      - 'forecast_lib/**'
      - 'kronos_src/**'
      - 'forecast_requirements.txt'
      - '.github/workflows/build-push-acr-forecast.yml'

jobs:
  gates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system libs for WeasyPrint + CJK fonts (PDF export tests)
        # 2026-09-18: 与 build-push-acr.yml 同一根因 —— 缺 pango/cairo/noto-cjk 时
        # WeasyPrint 渲染不出中文, test_pdf_export 断言 "广汽集团"/正文文本 命中二进制乱码而红。
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpango-1.0-0 libpangoft2-1.0-0 libcairo2 \
            libgdk-pixbuf-2.0-0 libffi-dev shared-mime-info fonts-noto-cjk

      - name: Backend pytest
        run: |
          set -o pipefail
          python3 -m pip install -q -r requirements.txt pytest-timeout  # pytest-timeout 保留: 局部标记仍可用
          # W2.1/C3(2026-09-09): 越权静态扫描(与 build-and-push-image.yml 同门禁)
          python3 scripts/check_scoped_queries.py
          # W3.1/D2(2026-09-09): 方言分叉只允许出现在 src/db/ 层
          python3 scripts/check_is_pg_scope.py
          # W2.3/E2(2026-09-09): 联网测试统一打 pytestmark=network, CI 主门禁跳过(同 build-push-acr)
          # 2026-09-18: 去掉全局 `--timeout=60` —— 与 build-push-acr.yml 同一根因:
          # scrypt(n=2^15) 密集的认证用例(test_email_reg_api_keys)与 tradingagents 采集用例
          # 在慢跑机上超 60s 被 pytest-timeout 误杀(本地各 ~5s), 与产品行为无关;
          # 另补两条 --ignore 与跑绿的 test job 对齐(这两个文件在 CI 缺依赖/数据必挂)。
          # 300 秒仅防单个测试无限挂起；thread 模式输出线程栈后让进程非零退出，
          # 不允许忽略超时继续构建。75 分钟 job 上限用于兜住 fixture 或原生代码挂死。
          # 显示当前用例并在首个错误停止，避免重复 fixture 失败拖满作业且无法定位。
          python3 -m pytest tests/ -v -x -m "not network" --timeout=300 --timeout-method=thread \
            --ignore=tests/test_dark_l2_engine.py \
            --ignore=tests/test_thsdk_extended.py

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    needs: gates
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Read VERSION
        id: ver
        run: |
          REF_TYPE="${GITHUB_REF_TYPE:-}"
          REF_NAME="${GITHUB_REF_NAME:-}"
          if [[ "$REF_TYPE" == "tag" && "$REF_NAME" == v* ]]; then
            V="$REF_NAME"
          elif [[ "$REF_NAME" == v* ]]; then
            V="$REF_NAME"
          else
            V=$(cat VERSION 2>/dev/null || echo "0.0.0")
          fi
          echo "version=$V" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Aliyun ACR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: crpi-mte80ai8o78b1429.cn-shanghai.personal.cr.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push (forecast)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile.forecast
          platforms: linux/amd64
          push: true
          tags: |
            crpi-mte80ai8o78b1429.cn-shanghai.personal.cr.aliyuncs.com/xiaozexwz/xzxwz-forecast:${{ steps.ver.outputs.version }}
            crpi-mte80ai8o78b1429.cn-shanghai.personal.cr.aliyuncs.com/xiaozexwz/xzxwz-forecast:latest
          # 个人版 ACR 不支持 OCI attestation 清单(与主镜像流水线同口径)
          provenance: false
          sbom: false
