# AI 代码审查门禁 —— 用 alibaba/open-code-review 审 PR diff
#
# 定位: 审「这次改动引入了什么缺陷」(bug/安全/性能)。
#       与 spec-gate.yml 互补:
#         spec-gate  → 审「承诺有没有测试守着」(缺失类问题)
#         本 workflow → 审「代码里有没有具体缺陷」(存在类问题)
#
# 走 PR diff 而不是全仓 scan: 全仓一次 18 万 token 起步, CI 里不现实。
#
name: ai-code-review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# 同一 PR 的新推送取消旧的审查(否则每次 push 都排一次付费审查)
concurrency:
  group: ai-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    # 审查一次 170 文件 diff 约 36 分钟; 不设上限时网关卡住会占满 runner 默认 6 小时。
    timeout-minutes: 50
    permissions:
      contents: read
      # upload-sarif 必需: 存在 permissions 块时未声明的 scope 全为 none,
      # 旧配置只有 contents:read → "Resource not accessible by integration"。
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # 需要 base 分支做 merge-base 比对

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'

      - name: Install open-code-review
        run: npm install -g @alibaba-group/open-code-review

      # 自定义网关配置(gemini-sub / codebuddy 走 OpenAI 兼容协议)
      # ⚠️ 网关只认自定义头 x-gemini-sub-local-key, Authorization: Bearer 会被 401
      - name: Configure provider
        env:
          OCR_API_KEY: ${{ secrets.OCR_API_KEY }}
          OCR_LOCAL_KEY: ${{ secrets.OCR_LOCAL_KEY }}
          OCR_GATEWAY_URL: ${{ vars.OCR_GATEWAY_URL }}
          OCR_MODEL: ${{ vars.OCR_MODEL }}
        run: |
          if [ -z "$OCR_GATEWAY_URL" ] || [ -z "$OCR_MODEL" ] || [ -z "$OCR_API_KEY" ]; then
            echo "::error::AI review 未配置 OCR_GATEWAY_URL、OCR_MODEL 或 OCR_API_KEY；未执行审查。"
            exit 1
          fi
          ocr config set provider ls-gemini
          ocr config set custom_providers.ls-gemini.url "$OCR_GATEWAY_URL"
          ocr config set custom_providers.ls-gemini.protocol openai
          ocr config set custom_providers.ls-gemini.model "$OCR_MODEL"
          ocr config set custom_providers.ls-gemini.api_key "$OCR_API_KEY"
          if [ -n "$OCR_LOCAL_KEY" ]; then
            ocr config set custom_providers.ls-gemini.extra_headers "x-gemini-sub-local-key=$OCR_LOCAL_KEY"
          fi

      - name: AI review (SARIF)
        id: review
        env:
          # 表达式只经 env 传入, 绝不内联进 run: —— git ref 合法字符含 $ ( ) ` ; ,
          # 直接拼接分支名等于把 ref 当 shell 代码执行, 而前面的步骤已把 provider
          # API key 写进工作区的 ocr 配置。
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          base="origin/${BASE_REF:-main}"
          git rev-parse --verify --quiet "$base" >/dev/null || base="$BASE_REF"
          head="origin/${HEAD_REF}"
          if ! git rev-parse --verify --quiet "$head" >/dev/null; then
            head="$HEAD_SHA"   # fork PR: 只 fetch 了 base 仓库的 ref
          fi
          ocr review --from "$base" --to "$head" \
            --format sarif --output ocr.sarif
          test -s ocr.sarif

      - name: Upload SARIF
        # 审查步骤失败(阈值/网关抖动)时也要留住报告, 否则最需要排查时产物消失。
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ocr-sarif
          path: ocr.sarif
          if-no-files-found: ignore

      # 接 GitHub Code Scanning(需要 security-events: write)
      - name: Upload to Code Scanning
        if: always() && hashFiles('ocr.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          sarif_file: ocr.sarif
          category: ai-code-review
