# Dependabot 周更配置 (W2.5/E6, 2026-09-09; 2026-11-19 拆组)
# 三个生态 weekly; 按 **patch/minor** 与 **major** 分两组, 避免"一次升 119 个包"的巨型 PR
# (那种 PR 必然 CI 全红、无人可审, 实测长期挂着 3 个红 PR 反而伤害仓库观感)。
# 安全更新: Dependabot security updates(基于告警)自动单独开 PR、不在此分组。
version: 2
updates:
  # Python 后端: requirements-lock.txt 命中 dependabot 的 requirements-*.txt 匹配,
  # 直接 bump 锁定精确版本。requirements.txt 的 loose 约束由 CI 守卫脚本
  # (check_lock_covers_reqs.py)保证不漂移, 不单独依赖 dependabot 更新。
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      python-patch-minor:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      python-major:
        patterns:
          - '*'
        update-types:
          - major

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      npm-patch-minor:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      npm-major:
        patterns:
          - '*'
        update-types:
          - major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions-deps:
        patterns:
          - '*'
