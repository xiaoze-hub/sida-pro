# SIDA 基础告警规则 (2026-08-23 Q4, 2026-09-07 P4 修死规则)
#
# P4 实测: 本文件三条数据告警曾引用不存在的指标名, 一条都没响过。
# 实际指标名见 src/web/api/health.py (_init_metrics):
#   sida_http_requests_total{method,path,status} / sida_datasource_failures_total{provider,kind}
#   sida_health_component_status{component} (component=database|redis|scheduler_leader, 1=ok, 0=down)
# 改任一指标名必须同步改此处 + 跑 tests/test_p4_alerts.py (双向锁定)。

groups:
  - name: sida-availability
    rules:
      # 5xx 率过高(滑动 5 分钟)
      - alert: SidaHigh5xxRate
        expr: |
          (
            sum by (service) (rate(sida_http_requests_total{status=~"5.."}[5m]))
            /
            clamp_min(sum by (service) (rate(sida_http_requests_total[5m])), 0.001)
          ) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "SIDA 5xx 率超过 5% ({{ $labels.service }})"
          description: "过去 5 分钟 5xx 占比 {{ $value | humanizePercentage }}"

      # 实例无指标(心跳丢失)
      - alert: SidaInstanceDown
        expr: up{job="sida-panwatch"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "SIDA 后端 /metrics 心跳丢失"
          description: "{{ $labels.instance }} 无指标输出 2 分钟以上"

      # PG 不可用(/health 数据库检查 down; hypertable 读/写全挂, P4 新增)
      - alert: SidaPostgresDown
        expr: sida_health_component_status{component="database"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "SIDA PG 不可用(/health database=down)"
          description: "PG 连接失败, K线/持仓/审计全挂, 检查 panwatch-postgres(--network-alias postgres 是否在)"

      # 调度器选主失效(A3, 2026-09-08): fail-closed 下 Redis 不可用则无实例跑调度
      # (standby 合法让位不记 0, 不误报; 只有无实例在跑才响)
      - alert: SidaSchedulerLeaderDown
        expr: sida_health_component_status{component="scheduler_leader"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "SIDA 调度器选主失效(/health scheduler_leader=down)"
          description: "无任何实例在跑调度(Redis 不可用 fail-closed 或 leader 调度器停摆), 定时 Agent/报告全停, 检查 panwatch-redis 与选主日志"

  - name: sida-quality
    rules:
      # 数据源失败激增(15 分钟窗口)
      - alert: SidaDatasourceFailures
        expr: increase(sida_datasource_failures_total[15m]) > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "数据源失败次数激增(15 分钟 > 50)"
          description: "{{ $labels.provider }} {{ $labels.kind }} 失败 {{ $value }} 次, 检查上游行情源"

      # Redis 业务缓存降级(health 组件状态)
      - alert: SidaRedisDown
        expr: sida_health_component_status{component="redis"} == 0
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "SIDA Redis 不可用(biz_cache 降级回内存)"
          description: "Redis 连接失败, 缓存/限流/Streams 已降级, 检查 panwatch-redis"
