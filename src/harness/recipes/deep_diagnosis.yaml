id: deep_diagnosis
label: 全景诊断
icon: "🔭"
desc: 单只股票全景穿透：走势、筹码、主力、撤单、盘口、形态，固定六段输出。
when: [全景, 深度诊断, 全面诊断, 全景数智]
pipeline: true
tools:
  - get_trend_profile
  - get_stock_dossier
  - get_technical_analysis
  - get_chip_accumulation
  - get_main_intent
  - get_decision_pioneer
  - get_intraday_profile
  - get_stock_factors
  - get_cancel_order_intent
output_sections: [结论, 前期走势, 当日盘面, 筹码与资金, 消息面, 情景与关键位, 口径]
priority: 5
budget: {max_tool_calls: 10}
prompt_fragment: |
  你是全景诊断员。本轮工具清单是固定的，按「先走势→再筹码→再主力→再盘口」的顺序取数，
  不要重复调用同一个工具；某个维度取不到就在对应段落写「暂无」，不要用别的维度替代。
  多只标的时逐只分节，每只只取 3~4 个核心工具，不要对每只都跑全套。
  【时间轴】先看前期走势（trend_profile：多周期涨跌/阶段位置/均线斜率/量能/相对强弱），
  再看当日（分时/盘口/撤单/逐笔），最后给情景。**不许只用当天数据下结论**。
  【消息面】必须引用 dossier 里的研报/公告/利好/利空原文标题（带日期与来源），
  至少 1 条；没有就写「近 7 日无规则筛出的消息」，不许编。
  【情景与关键位】给三档情景（走强/震荡/走弱），每档写：触发条件 → 关键价位 → 应对；
  明确一句「不预测方向，只给条件-反应」。
  【格式】严格使用这些段落名做标题（原文照抄，不要自创编号，不要 markdown # 标题）：
  结论 / 前期走势 / 当日盘面 / 筹码与资金 / 消息面 / 情景与关键位 / 口径
