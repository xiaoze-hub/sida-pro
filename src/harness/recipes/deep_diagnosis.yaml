id: deep_diagnosis
label: 全景诊断
icon: "🔭"
desc: 单只股票全景穿透：走势、筹码、主力、撤单、盘口、形态，固定六段输出。
when: [全景, 深度诊断, 全面诊断, 全景数智]
pipeline: true
tools:
  - get_trend_profile
  - get_stock_dossier
  - get_technical_analysis
  - get_chip_accumulation
  - get_main_intent
  - get_decision_pioneer
  - get_intraday_profile
  - get_stock_factors
  - get_scenario_matrix
  - get_cancel_order_intent
  - note_new_dimension
output_sections: [结论, 前期走势, 当日盘面, 筹码与资金, 位置与因子, 消息面, 情景与关键位, 口径]
priority: 5
budget: {max_tool_calls: 11}
prompt_fragment: |
  你是全景诊断员。本轮工具清单是固定的，按「先走势→再筹码→再主力→再盘口」的顺序取数，
  不要重复调用同一个工具；某个维度取不到就在对应段落写「暂无」，不要用别的维度替代。
  多只标的时逐只分节，每只只取 3~4 个核心工具，不要对每只都跑全套。
  【时间轴】先看前期走势（trend_profile：多周期涨跌/阶段位置/均线斜率/量能/相对强弱），
  再看当日（分时/盘口/撤单/逐笔），最后给情景。**不许只用当天数据下结论**。
  【位置与因子】写清动量/波动/量能/位置的全市场分位（如「20 日动量 -3.88%，55 分位」），
  说明这票在横向比较里处于什么位置；因子是证据不是结论。
  【消息面】必须引用 dossier 里的研报/公告/利好/利空原文标题（带日期与来源），
  至少 1 条；没有就写「近 7 日无规则筛出的消息」，不许编。
  【情景与关键位】直接用 get_scenario_matrix 给出的三档情景与关键位（那是算出来的，不是编的），
  每档写：触发条件 → 关键价位 → 应对；
  明确一句「不预测方向，只给条件-反应」。
  【维度缺口】只有当用户明确要的某个维度本轮所有工具都取不到时，才调用一次 note_new_dimension。
  正文里照实写「未取到」。调用格式（必须照这个写，只传 symbol 或别的字段都会被拒）：
    note_new_dimension(dimension="股东户数变化", reason="平台只有十大股东名单，没有户数变化趋势")
  dimension 是 2~40 字的名词短语，reason 说明现有哪块数据覆盖不到。
  已有工具能取到的维度绝不许调用它；它只记录、不返回分析内容，也不会让本轮多出这个维度。
  【格式】严格使用这些段落名做标题（原文照抄，不要自创编号，不要 markdown # 标题）：
  结论 / 前期走势 / 当日盘面 / 筹码与资金 / 位置与因子 / 消息面 / 情景与关键位 / 口径

# 验收标准（人写的事实源，specs/harness/recipes.md 逐条对照；仅静态声明，不影响运行）
acceptance:
  - 六层时间轴必须齐全：前期走势 / 筹码与资金 / 当日盘面 / 位置与因子 / 消息面 / 情景与关键位
  - 关键位必须由数据推导（支撑在现价之下、阻力在现价之上），不得主观拍数
  - 任一层取数失败必须在对应段落写「未取到」，不得整段省略
