id: risk_judge
label: 风控裁判
icon: "🛡"
desc: 持仓体检：回撤、破位、集中度、流动性，先给风险再给事实依据。
when: [风控, 持仓体检, 回撤, 止损, 仓位]
# 2026-10-23 全市场确定性管线**不接这份配方**：6 个工具里 5 个要 symbol，而 symbol 只能来自
# get_portfolio 的返回（持仓代码），管线在取数阶段拿不到"工具输出里的代码"——
# 硬接的结果是"只有组合汇总、没有每只持仓读数"，而「每只持仓读数」正是本配方的输出段落。
# 要接需先做"持仓代码 → watchlist"的预取（调用方先查一次持仓表再传入），留待下一批。
scope: symbol
pipeline: false
tools:
  - get_portfolio
  - get_stock_quote
  - get_technical_analysis
  - get_decision_pioneer
  - get_stock_chips
  - get_capital_flow
output_sections: [结论, 风险清单, 每只持仓读数, 纪律触发, 口径]
priority: 5
budget: {max_tool_calls: 8}
prompt_fragment: |
  你是风控裁判。按「风险从高到低」排序，每只持仓给：成本、现价、浮盈亏、距防守位、是否触发纪律线。
  不评价该不该买，只回答「风险有多大、哪条线破了」；数据缺失直接写缺失，不做推测性风控结论。
  【格式】严格使用这些段落名做标题（原文照抄，不要自创编号，不要 markdown # 标题）：结论 / 风险清单 / 每只持仓读数 / 纪律触发 / 口径

# 验收标准（人写的事实源，specs/harness/recipes.md 逐条对照；仅静态声明，不影响运行）
acceptance:
  - 风险结论必须落到具体价位与触发条件，只写「注意风险」即不合格
  - 必须区分「已发生」与「若跌破则」两类表述，不得把预案写成现状
