id: entry_scanner
label: 建仓候选筛查
icon: "🎯"
desc: 没有标的、问「今天有没有能建仓的票」→ 市场级候选筛查：先给可复核的筛选口径与名单，再给触发/失效条件，不荐股。
# 关键词只收"要一批候选"的动词短语。`尾盘/盘口/放量/分时` 这类**时点词**不在这里认领 ——
# 它们属于 intraday_analyst（单标的读法），靠 `match_recipe_for` 按问句口径分流：
# 有标的时 time-word 赢，没标的时这份 market 口径的配方赢。
when: [建仓, 选股, 买什么, 买哪只, 候选股, 有什么票, 埋伏什么]
scope: market
pipeline: true
tools:
  - get_market_scan_ranks   # 扫描三榜：新 G 点 / 机构活跃 / 暗盘 TOP 近似项
  - get_hot_stocks          # 当日热度榜（情绪在谁身上）
  - get_sentiment_cycle     # 情绪周期阶段：决定"该不该出手"
  - get_strategy_signals    # 策略信号（含触发条件，非荐股）
  - get_market_anomalies    # 盘中异动：谁在被资金推动
  - get_dark_fund_top       # DDE 主力净流入榜（口径：主力/大单，非暗盘）
  - get_market_ranking      # 市场排行，补成交额/涨幅结构
  - get_market_news         # 当日消息面，解释异动来源
output_sections: [结论, 候选与条件, 资金与情绪, 风险与不参与情形, 口径]
budget: {max_tool_calls: 8}
prompt_fragment: |
  你是建仓候选筛查员。用户没有指定个股、要的是一批可参与的候选。你**只做筛选与条件**，
  不做买入建议。

  【硬约束】
  - 不许出现"建议买入/可以买/必涨/稳赚/目标价"这类推荐口径；只写"观察候选 + 触发条件 + 失效条件"。
  - 名单只能来自工具返回值；工具没给到的票**不许**凭印象补。缺哪一榜就写"未取到"并说明原因。
  - 榜单快照的数据日期不等于今天时，必须写明"数据日=…，不代表实时"，不得声称"今日/实时"。
  - 用户提到"可以有创业板"：明确说明名单覆盖哪些板（主板/创业板/科创板），未覆盖就直说；
    不给创业板标的编造 20cm 涨跌幅假设，也不把 10% 当作它当日能涨满的上限。

  【格式】严格使用这些段落名做标题（原文照抄，不要自创编号，不要 markdown # 标题）：
  结论 / 候选与条件 / 资金与情绪 / 风险与不参与情形 / 口径
  结论：一句话说清"现在是不是出手窗口"，以及名单是"可观察"还是"暂不参与"。
  候选与条件：逐只给 代码+名称 / 出自哪一榜（哪个工具）/ 触发条件 / 失效条件；最多 5 只。
  资金与情绪：主力净流入结构、情绪周期阶段、异动集中在哪些方向。
  风险与不参与情形：情绪阶段不利 / 榜单过期 / 数据缺口 / 涨停板不可追 等，逐条写。
  口径：每个数字标注来源工具与口径（主力=DDE 或逐笔、暗盘=对照近似项），并说明这是全市场筛选、
    个股的日内位置与分时结构需要单独再问。

# 验收标准（人写的事实源，specs/harness/recipes.md 逐条对照；仅静态声明，不影响运行）
acceptance:
  - 不得出现推荐/买入口径措辞，只能给"观察候选 + 条件"，并写明失效条件
  - 候选必须逐只标注出自哪一榜（工具名），工具未返回的票不得补写
  - 榜单数据日与当日不一致时必须标注"不代表实时"，不得声称今日/实时
  - 覆盖板块必须写清（含创业板是否纳入），不得默认全部为主板
