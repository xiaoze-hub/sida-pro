version: 1
note: 数智参谋数据域目录：domains 是封闭集合，禁止 raw SQL；新增域必须在此登记。
domains:
- id: market.sentiment
  label: 市场情绪周期
  level: L0
  scope: market
  params: {}
  source: market_sentiment_daily / market/phase
  desc: 涨停/跌停/炸板/连板高度/情绪阶段
- id: limit.pool
  label: 涨停池与连板梯队
  level: L0
  scope: market
  params:
    date: 可选 YYYYMMDD
    min_streak: 可选 最低连板数
  source: limit_up_events / ladder_daily_snapshot / limit_strength_shadow
  desc: 涨停家数、连板梯队、封板强度、炸板
- id: lhb.daily
  label: 龙虎榜与席位
  level: L0
  scope: symbol_or_market
  params:
    symbol: 可选 6 位代码
    date: 可选
  source: dragon_tiger_events / lhb_seat_details
  desc: 净买额、买卖席位、游资/机构/量化标签
- id: theme.mood
  label: 题材情绪与生命周期
  level: L0
  scope: market
  params:
    top_n: 可选 默认 20
  source: theme_mood_daily / board_daily
  desc: 题材五维评分、生命周期阶段、板块资金
- id: stock.chip
  label: 筹码结构与集中度
  level: L0
  scope: symbol
  params:
    symbol: 必填
  source: chip_daily / stock_factor_daily
  desc: 成本分布、获利盘、集中度变化、筹码峰
- id: stock.flow
  label: 资金与主力意图
  level: L0
  scope: symbol
  params:
    symbol: 必填
    window: 可选 分钟窗口
  source: dde_minute_flow / cancel_rate_snapshots / l2_fund_snapshots
  desc: 主动买卖、大单净额、撤单率、DDE
- id: stock.intraday
  label: 分时结构与盘口
  level: L0
  scope: symbol
  params:
    symbol: 必填
  source: quote_snapshots / orderbook_snapshots
  desc: 日内位置、VWAP、分时段量能、内外盘、五档
- id: stock.factor
  label: 因子分位与有效性
  level: L0
  scope: symbol
  params:
    symbol: 必填
  source: stock_factor_daily / factor_ic_snapshots
  desc: 六因子分位、IC/IR、同组中位
- id: market.index
  label: 大盘指数与量能
  level: L0
  scope: market
  params: {}
  source: quote_snapshots / index_daily
  desc: 上证/深证/创业板点位与涨跌幅、两市成交额（库内指数快照，日线兜底）
- id: market.breadth
  label: 市场广度
  level: L0
  scope: market
  params: {}
  # ADL/ADR/ARMS/BTI/MCL/STIX 序列来自 market_breadth_daily（m180 建表语句是 f-string，
  # gen_data_catalog 的静态扫描看不到它，故不写进 source，避免 --check 误报）
  source: breadth_distribution_snapshot / market_regime_snapshots
  desc: 涨跌家数与 ADL/ADR/ARMS 分位、涨跌幅九档分布、市场状态（多空/样本数）
- id: market.mainline
  label: 主线榜
  level: L0
  scope: market
  params:
    top_n: 可选 取前几条（默认 10，上限 20）
  source: mainline_rank_daily / mainline_daily_snapshot
  desc: 主线排名与主线分、涨停家数、最高连板、龙头与成分股（日榜快照）
- id: board.daily
  label: 板块行情与资金
  level: L0
  scope: market
  params:
    top_n: 可选 每个方向返回几条（默认 6，上限 15）
  source: board_daily / boards / board_flow_snapshots
  desc: 板块涨跌幅与资金净流入排行、板块类型、龙头、盘中资金快照
- id: stock.quote
  label: 实时报价
  level: L0
  scope: symbol
  params:
    symbol: 必填 6 位代码
  source: quote_snapshots
  desc: 最新价/涨跌幅/开高低/成交量额/换手/量比；库内行超过 60s 转实时报价工具
- id: stock.kline
  label: K 线与周期
  level: L0
  scope: symbol
  params:
    symbol: 必填 6 位代码
    market: 可选 CN/HK/US（默认 CN）
    days: 可选 取多少根日K（默认 120，上限 500）
  source: klines
  desc: 前复权日K序列、开高低收量、均线 MA5/20/60、区间高低与区间涨跌（PG hypertable 只读）
- id: stock.tech
  label: 技术面与形态
  level: L0
  scope: symbol
  params:
    symbol: 必填 6 位代码
    market: 可选 CN/HK/US（默认 CN）
  source: stock_factor_daily / klines
  desc: 趋势/MACD/RSI/支撑压力位、日K量价威科夫结构、29 种 K 线组合形态（转发技术面工具）
- id: stock.dossier
  label: 研报公告新闻
  level: L0
  scope: symbol
  params:
    symbol: 必填 6 位代码
    market: 可选 CN/HK/US（默认 CN）
  source: more_info_daily / news_cache
  desc: 券商研报评级、公司公告、利好/利空消息面（转发全景档案工具，9 维证据）
- id: stock.fundamental
  label: 财务股东两融分红
  level: L0
  scope: symbol
  params:
    symbol: 必填 6 位代码
    market: 可选 CN/HK/US（默认 CN）
  # 两融/股东户数/分红/事件走 marketdata vendor（库内无对应表），故只登记真实落库的龙虎榜事件表
  source: dragon_tiger_events
  desc: 龙虎榜近 10 日、两融余额、股东户数环比、分红送转、事件日历（转发基本面明细工具）
- id: stock.scenario
  label: 情景与关键位
  level: L0
  scope: symbol
  params:
    symbol: 必填 6 位代码
  source: klines / stock_factor_daily
  desc: 支撑压力关键位与走强/震荡/走弱三档情景（转发情景矩阵工具，只给条件-反应）
- id: auction.flow
  label: 集合竞价
  level: L0
  scope: symbol_or_market
  params:
    symbol: 可选 6 位代码（给了看逐票竞价，不给看全市场竞价异动）
    limit: 可选 返回条数（默认 10，上限 30）
  source: auction_snapshots / auction_tick_snapshots / auction_anomaly_records
  desc: 9:25 竞价价/开盘涨幅/竞价成交额/一字买量/撤单率、逐帧撮合、竞价异动池
- id: portfolio.risk
  label: 持仓与风控
  level: L0
  scope: user
  params: {}
  source: positions / portfolio_risk_snapshots
  desc: 本人实盘+模拟盘持仓摘要、组合风险画像（信号数/高风险占比/前5集中度）；需登录态
- id: watchlist
  label: 自选股
  level: L0
  scope: user
  params: {}
  source: stocks
  desc: 本人自选股列表（按 user_id 隔离，未登录只说需要登录）
- id: paper.trading
  label: 模拟盘
  level: L0
  scope: user
  params: {}
  source: paper_trading_account / paper_trading_positions / paper_trading_trades
  desc: 模拟盘账户资金/盈亏/回撤、当前持仓、最近已平仓交易（按 user_id 隔离）
- id: backtest
  label: 回测
  level: L1
  scope: user
  params:
    top_n: 可选 取最近几条样本（默认 8，上限 20）
  source: strategy_outcomes / strategy_factor_snapshots
  desc: 策略信号事后收益（持有 N 日的平均收益/触达目标/止损）；回测引擎运行结果不落库，无样本即如实说无结果
- id: strategy.signal
  label: 策略信号
  level: L0
  scope: market
  params:
    top_n: 可选 取前几条（默认 10，上限 20）
  source: strategy_factor_snapshots / signal_snapshots
  desc: 策略选中票的因子分（alpha/quality/risk/crowd/总分）与信号发出版本（方向/强度/T+1/T+5 事后收益）
- id: notify.task
  label: 定时任务与通知
  level: L1
  scope: user
  params: {}
  source: copilot_schedules / notify_channels / notifications
  desc: 本人定时任务（时点/周别/启用状态）、推送渠道、站内通知；只读展示，不创建任务
- id: ops.config
  label: 平台设置与数据源
  level: L2
  scope: admin
  params:
    top_n: 可选 列几条数据源（默认 12，上限 40）
  source: data_sources / app_settings / datasource_failures
  desc: 数据源配置与优先级、vendor 信任分（成功率/延迟）、平台设置项 key、最近失败记录；只读不写入
